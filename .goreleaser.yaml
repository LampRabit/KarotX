# GoReleaser config: one self-contained binary per platform, UI embedded.
# Release: push a tag like v0.1.0 (see .github/workflows/release.yml).
# Local dry run: goreleaser release --snapshot --clean
version: 2
project_name: karotx

before:
  hooks:
    - pnpm -C web install --frozen-lockfile
    - pnpm -C web build

builds:
  - id: karotx
    main: ./cmd/karotx
    binary: karotx
    env:
      - CGO_ENABLED=0 # pure Go everywhere (SQLite via modernc), so cross-compiling just works
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: karotx
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^chore:", "^Merge "]

release:
  github:
    owner: LampRabit
    name: KarotX
  draft: true # the owner reviews the assets and publishes the release manually
  prerelease: auto # v0.x.y-rc1 etc. are marked as pre-releases
  header: |
    # KarotX {{ .Version }}

    KarotX is a browser-based database client distributed as a single Go binary. This release adds four databases, each through the UI first, with a console as the fallback.

    ## New databases

    - **ClickHouse** (and ClickHouse Cloud): browse databases and tables, the SQL editor, Query Commander, the table designer (MergeTree tables), import and export. The data grid is read-only because ClickHouse keys aren't unique.
    - **Neo4j** (and Neo4j Aura): a new graph view. Open a label or relationship type from the sidebar, see nodes as a graph or a table, filter by property, create, edit and delete nodes, connect two nodes, show a node's neighbours, or run Cypher in the console.
    - **Memcached**: the key browser, value editor with expiry, new keys, a command console (GET, SET, DEL, TTL, INCR, STATS…), export and import.
    - **DynamoDB** (AWS or DynamoDB Local): tables as collections, item view in table or JSON, visual filters (run as a Query when the partition key is set), insert, edit and delete items, create tables with partition and sort keys, PartiQL console, import and export. Sign in with access keys or an AWS profile.

    All four work with read-only and production connections and SSH tunnels, and can be listed in a services file (`--services`).

    ## Fixes

    - The Redis key browser could freeze the page when its tab opened before the database list loaded.

    ## Downloads

    Archives are attached for Windows, macOS and Linux on amd64 and arm64. `checksums.txt` contains SHA-256 checksums.

    This release is a draft. Review the builds and notes, then publish it when ready.
