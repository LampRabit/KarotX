# GoReleaser config: one self-contained binary per platform, UI embedded.
# Release: push a tag like v0.1.0 (see .github/workflows/release.yml).
# Local dry run: goreleaser release --snapshot --clean
version: 2
project_name: karotx

before:
  hooks:
    - pnpm -C web install --frozen-lockfile
    - pnpm -C web build

builds:
  - id: karotx
    main: ./cmd/karotx
    binary: karotx
    env:
      - CGO_ENABLED=0 # pure Go everywhere (SQLite via modernc), so cross-compiling just works
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: karotx
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^chore:", "^Merge "]

release:
  github:
    owner: LampRabit
    name: KarotX
  draft: true # the owner reviews the assets and publishes the release manually
  prerelease: auto # v0.x.y-rc1 etc. are marked as pre-releases
  header: |
    # KarotX {{ .Version }}

    KarotX is a browser-based database client distributed as a single Go binary. This is the first LampRabit release: the complete MVP for relational databases, Redis and MongoDB, plus import/export and live services-file integration.

    ## Features

    - Connect to PostgreSQL, MySQL, MariaDB, SQLite, Redis and MongoDB, with TLS and SSH tunnel support.
    - Browse schemas, tables, Redis keys and MongoDB collections in the UI.
    - Edit relational rows and MongoDB documents, and manage tables and schemas with previewed changes.
    - Build SQL visually with Query Commander, or use the SQL editor and database consoles.
    - Save connections and tabs in an encrypted workspace; keep credentials in the OS keychain.
    - Protect the browser UI with an optional password and use read-only and production safeguards.
    - Import and export tables, databases, Redis keys and MongoDB collections (CSV, JSON, SQL) from the UI, with progress and Stop.
    - Run with `--services <file>` to show databases managed by another tool, such as LampRabit, automatically; the list updates live as databases are added, removed, started or stopped. `--lamprabit` is an alias.

    ## Downloads

    Archives are attached for Windows, macOS and Linux on amd64 and arm64. `checksums.txt` contains SHA-256 checksums.

    This release is a draft. Review the builds and notes, then publish it when ready.
