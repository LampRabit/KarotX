name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build UI (type-check + bundle)
        run: |
          pnpm -C web install --frozen-lockfile
          pnpm -C web build

      - name: Go format check
        run: test -z "$(gofmt -l cmd internal web)" || (gofmt -l cmd internal web && exit 1)

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test -race ./...

  release-dry-run:
    name: Release dry run (all platforms)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean
      - name: Smoke test the Linux binary
        run: |
          bin=$(find dist -path '*linux_amd64*' -name karotx -type f | head -1)
          "$bin" --version
